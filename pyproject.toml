[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "erasewitness"
version = "0.1.0"
description = "Prove whether an AI agent's memory really forgot."
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "SaiPisey2" }]
dependencies = [
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "typer>=0.12",
  "jinja2>=3.1",
  "cryptography>=42",
]

[project.optional-dependencies]
judges = ["typesafe-sdk>=0.7.1,<0.8", "system-one-adapter[openai]>=0.2.1,<0.3"]
mem0 = ["mem0ai>=2.2.1,<2.3"]
dev = [
  "pytest>=8",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML",
  "typesafe-sdk>=0.7.1,<0.8",
  "system-one-adapter[openai]>=0.2.1,<0.3",
  "mem0ai>=2.2.1,<2.3",
]

[project.scripts]
erasewitness = "erasewitness.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/erasewitness"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
disallow_untyped_decorators = false
